[project]
name = "papersearcher"
version = "0.1.0"
description = "췌장암 신약·임상·치료 정보 자동 수집 위키"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "feedparser>=6.0",
]

[project.optional-dependencies]
site = ["mkdocs-material>=9.5"]
dev = ["pytest>=8"]

[project.scripts]
papersearcher = "collector.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
