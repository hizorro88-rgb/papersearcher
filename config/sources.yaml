# 수집 소스 설정. 각 소스는 collector/sources/<name>.py 어댑터가 처리한다.
pubmed:
  enabled: true
  # 췌장암 핵심 검색식. [tiab]=제목/초록, [MeSH]=의학주제표목
  term: >-
    ("Pancreatic Neoplasms"[MeSH] OR "pancreatic cancer"[tiab] OR
    "pancreatic adenocarcinoma"[tiab] OR "pancreatic ductal adenocarcinoma"[tiab] OR PDAC[tiab])
  lookback_days: 3        # 색인 지연을 고려해 겹쳐서 조회 (중복은 병합 단계에서 제거)
  max_results: 300
  api_key_env: NCBI_API_KEY

clinicaltrials:
  enabled: true
  condition: "pancreatic cancer OR pancreatic adenocarcinoma OR pancreatic neoplasm"
  lookback_days: 3        # LastUpdatePostDate 기준
  max_results: 300
  # 첫 실행(data가 비어 있을 때)에는 현재 모집 중인 시험을 한 번에 가져온다.
  bootstrap_recruiting: true
  bootstrap_max_results: 400

europepmc:
  enabled: true
  query: >-
    (TITLE:"pancreatic cancer" OR TITLE:"pancreatic adenocarcinoma" OR TITLE:PDAC OR
    TITLE:"pancreatic ductal") AND (SRC:PPR)
  lookback_days: 3
  max_results: 100

# 다이제스트 첫 화면에 올릴 중요도 하한
importance_threshold: 0.6
# 이 값 미만의 관련도는 저장하지 않는다 (노이즈 제거)
relevance_floor: 0.25

llm:
  enabled: true
  model: claude-opus-5-5
  max_items_per_run: 120   # 1회 실행당 요약 상한 (비용 상한). 넘치면 다음 실행에서 이어서 처리
  concurrency: 4
