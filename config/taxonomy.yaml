      - "phase (1|2|3|I|II|III)|randomi[sz]ed|randomized controlled|open-label|double-blind|placebo-controlled|clinical trial"
      - "enrol(l)?ment|eligib(le|ility)|recruit"
  surgery:
    name: 수술
    description: 췌장 절제술, 수술 전후 관리, 합병증, 수술 적응
