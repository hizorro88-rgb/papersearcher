# 근거 수준. 위에서부터 순서대로 검사해 처음 매치되는 것을 채택한다.
evidence:
  - key: guideline
    name: 가이드라인
    weight: 1.0
    pubtypes: ["Practice Guideline", "Guideline", "Consensus Development Conference"]
    patterns: ["guideline|consensus statement|recommendation"]
  - key: meta
    name: 메타분석
    weight: 1.0
    pubtypes: ["Meta-Analysis", "Systematic Review"]
    patterns: ["meta-analysis|systematic review|pooled analysis"]
  - key: phase3
    name: 3상
    weight: 1.0
    pubtypes: ["Clinical Trial, Phase III", "Clinical Trial, Phase IV"]
    patterns: ["phase (3|III|4|IV)\\b"]
  - key: phase2
    name: 2상
    weight: 0.8
    pubtypes: ["Clinical Trial, Phase II"]
    patterns: ["phase (2|II)\\b|phase (1|I)[/-](2|II)\\b"]
  - key: phase1
    name: 1상
    weight: 0.65
    pubtypes: ["Clinical Trial, Phase I"]
    patterns: ["phase (1|I)\\b|first-in-human|dose[- ]escalation"]
  - key: rct
    name: 무작위 임상
    weight: 0.9
    pubtypes: ["Randomized Controlled Trial", "Clinical Trial"]
    patterns: ["randomi[sz]ed"]
  - key: observational
    name: 관찰·코호트
    weight: 0.6
    pubtypes: ["Observational Study", "Multicenter Study", "Comparative Study"]
    patterns: ["retrospective|cohort|registry|real-world|propensity"]
  - key: review
    name: 종설
    weight: 0.5
    pubtypes: ["Review"]
    patterns: ["\\breview\\b|overview|perspective"]
  - key: case
    name: 증례
    weight: 0.3
    pubtypes: ["Case Reports"]
    patterns: ["case report|case series"]
  - key: preclinical
    name: 전임상
    weight: 0.3
    pubtypes: []
    patterns: ["in vitro|in vivo|xenograft|organoid|mouse|murine|cell line"]
  - key: press
    name: 보도자료
    weight: 0.4
    pubtypes: []
    patterns: []
  - key: other
    name: 기타
    weight: 0.45
    pubtypes: []
    patterns: []

# 관련도 계산용 핵심어 (제목 매치 가중)
core_terms:
  - "pancrea"
  - "PDAC"
  - "췌장"

# 소스 신뢰도 (0~1)
source_trust:
