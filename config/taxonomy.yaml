  "Lancet": 1.0
  "Lancet Oncol": 1.0
  "JAMA": 0.95
  "JAMA Oncol": 0.95
  "J Clin Oncol": 0.95
  "Nature": 0.95
  "Nat Med": 0.95
  "Ann Oncol": 0.9
  "Cancer Discov": 0.9
  "Gastroenterology": 0.9
  "Ann Surg": 0.9
