      - "PARP|olaparib|niraparib|talazoparib|rucaparib"
      - "pembrolizumab|nivolumab|ipilimumab|durvalumab|atezolizumab|immune checkpoint|PD-1|PD-L1|CTLA-4"
      - "CAR-T|CAR T|TCR|cell therapy|vaccine|mRNA|neoantigen|autogene cevumeran"
      - "antibody[- ]drug conjugate|ADC\\b|bispecific|claudin ?18\\.2|zolbetuximab|mesothelin|TROP-?2|nectin"
      - "NALIRIFOX|FOLFIRINOX|gemcitabine|nab-paclitaxel|irinotecan|liposomal irinotecan|capecitabine|S-1\\b|oxaliplatin"
      - "novel (agent|drug|therapy|inhibitor)|first-in-human|investigational|targeted therapy|small[- ]molecule|inhibitor\\b"
