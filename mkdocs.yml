site_name: 췌장암 정보 위키
site_description: 췌장암 신약·임상시험·수술·치료 관련 논문과 소식을 매일 자동 수집해 한국어로 정리합니다.
site_url: https://pancreas.dopamine.me.kr/
repo_url: https://github.com/hizorro88-rgb/papersearcher
repo_name: hizorro88-rgb/papersearcher
edit_uri: edit/main/docs/
copyright: 이 사이트의 정보는 의료 조언이 아닙니다. 치료 결정은 담당 의료진과 상의하세요.

theme:
  name: material
  language: ko
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra:
  # giscus 설정: docs/SETUP.md 참고. repo_id / category_id를 채우면 댓글이 켜진다.
  giscus:
    repo: hizorro88-rgb/papersearcher
    repo_id: ""
    category: Comments
    category_id: ""
  sponsor_url: https://github.com/sponsors/hizorro88-rgb
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizorro88-rgb/papersearcher
    - icon: material/rss
      link: https://pancreas.dopamine.me.kr/_generated/feed.xml

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/glossary.js
  - javascripts/trial-finder.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs
      check_paths: false

plugins:
  - search:
      lang: [ko, en]
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

nav:
  - 홈: index.md
  - 응급·증상 찾기:
      - guides/emergency/index.md
      - 증상·상황으로 찾기: guides/emergency/find-by-symptom.md
      - 바로 응급실·119:
          - 항암 중 발열: guides/emergency/fever-neutropenia.md
          - 출혈: guides/emergency/bleeding.md
          - 장폐색·구토: guides/emergency/bowel-obstruction.md
          - 혈전·호흡곤란: guides/emergency/thrombosis.md
          - 통증 악화: guides/emergency/pain-crisis.md
      - 당일 병원 연락:
          - 황달·담관염·스텐트: guides/emergency/jaundice-cholangitis.md
          - 혈당 이상: guides/emergency/glucose.md
          - 탈수·설사: guides/emergency/dehydration-diarrhea.md
          - 섬망·의식 변화: guides/emergency/delirium.md
          - 부종·림프부종: guides/emergency/lymphedema.md
      - 연락처:
          - 병원 연락처: guides/emergency/hospital-contacts.md
          - 사설 구급차 연락처: guides/emergency/private-ambulance.md
  - 치료 알아보기:
      - guides/treatment/index.md
      - 진단 직후 체크리스트: guides/start-here.md
      - 진단 검사와 병기: guides/treatment/diagnosis-staging.md
      - 수술: guides/treatment/surgery.md
      - 시술 (배액관·스텐트·케모포트): guides/treatment/procedures.md
      - 방사선치료: guides/treatment/radiation.md
      - 항암치료와 표적·면역치료: guides/treatment/chemotherapy.md
      - 완화의료와 호스피스: guides/treatment/palliative.md
  - 투병 생활:
      - guides/living/index.md
      - 항암 시작 전 준비: guides/living/before-chemo.md
      - 항암 부작용별 대처: guides/living/side-effects.md
      - 식사와 영양: guides/living/nutrition.md
      - 보조제와 건강식품: guides/living/supplements.md
      - 통증 조절의 원칙: guides/living/pain.md
      - 병원 이용 요령: guides/living/hospital-tips.md
      - 마음 돌보기와 가족: guides/living/mind-and-family.md
  - 임상시험:
      - 임상시험 목록: _generated/trials/index.md
      - 맞춤 임상시험 찾기: guides/trials/finder.md
      - 참여 방법 안내: guides/trials/how-to-apply.md
      - 임상시험 용어: guides/trials/glossary.md
  - 연구·소식 (자동 수집):
      - 날짜별: _generated/daily/index.md
      - 신약·치료제: _generated/categories/drug.md
      - 수술: _generated/categories/surgery.md
      - 치료 전반: _generated/categories/treatment.md
      - 진단·조기발견: _generated/categories/diagnosis.md
      - 지지요법·삶의질: _generated/categories/supportive.md
      - 제약사·규제: _generated/categories/industry.md
      - 기초연구: _generated/categories/basic.md
      - 주제별 (약물·수술법): _generated/topics/index.md
  - 용어사전: guides/glossary.md
  - 소개:
      - 이 사이트에 대해: about/index.md
      - 수집 소스와 방법: about/sources.md
      - 수집 현황: _generated/status.md
      - 면책 고지: about/disclaimer.md
      - 기여·수정 요청: about/contributing.md
      - 후원하기: about/sponsor.md
